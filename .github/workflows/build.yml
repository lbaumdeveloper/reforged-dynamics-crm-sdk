name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Pack
        run: |
          if [ -n "$PACKAGE_VERSION" ]; then
            dotnet pack -c Release --no-build -o artifacts -p:Version="$PACKAGE_VERSION"
          else
            dotnet pack -c Release --no-build -o artifacts
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg

  verify-packages-config:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: samples/PackagesConfigPlugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: artifacts

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2

      - name: Use packed version in packages.config
        shell: pwsh
        run: |
          $package = Get-ChildItem ..\..\artifacts\Reforged.Dynamics.Crm.Sdk.*.nupkg | Select-Object -First 1
          $version = $package.BaseName -replace '^Reforged\.Dynamics\.Crm\.Sdk\.', ''
          (Get-Content packages.config) -replace '(id="Reforged\.Dynamics\.Crm\.Sdk" version=")[^"]+', "`${1}$version" | Set-Content packages.config

      - name: Restore
        run: nuget restore packages.config -PackagesDirectory packages -ConfigFile nuget.config

      - name: Build
        run: msbuild PackagesConfigPlugin.csproj /p:Configuration=Release /v:minimal

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify-packages-config]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish to GitHub Packages
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.GITHUB_TOKEN }}" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate
